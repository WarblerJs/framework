<!doctype html>
<html lang="en" data-page="login">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/app.css">
    <script type="module" src="/app.js"></script>
    <title>Warbler · {{ title }}</title>
  </head>
  <body class="min-h-screen bg-gray-50 p-8">
    <form id="login-form" method="post" class="mx-auto flex max-w-md flex-col gap-4 rounded-lg border border-slate-200 bg-white p-6 shadow-md">
      <div>
        <label for="email">Email</label>
        <input id="email" name="email" class="w-full rounded-md border p-2">
        <span data-wbr-error-for="email" class="text-sm text-red-700"></span>
      </div>

      <div>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" class="w-full rounded-md border p-2">
        <span data-wbr-error-for="password" class="text-sm text-red-700"></span>
      </div>

      <div>
        <label for="confirm-password">Confirm password</label>
        <input id="confirm-password" name="confirmPassword" type="password" class="w-full rounded-md border p-2">
        <span data-wbr-error-for="confirmPassword" class="text-sm text-red-700"></span>
      </div>

      <label class="flex items-center gap-2">
        <input name="remember" type="checkbox">
        Remember me
      </label>

      <div data-wbr-form-errors class="text-sm text-red-700"></div>

      <button type="submit" class="rounded-md bg-indigo-600 p-2 text-white">
        Login
      </button>
    </form>
  </body>
</html>
